<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <!-- Noto Sans Korean , Orbitron , Poppins 폰트링크 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&family=Orbitron:wght@800;900&family=Poppins:ital,wght@0,500;0,700;0,800;1,500;1,800&display=swap"
    rel="stylesheet">

    <style>
        body{
             font-family: "Orbitron", "sans-serif";
        }

        h1 ,h2, h3{
            font-size: 100px;
            margin: 30px;
        }
        em{
            color: red;
        }

        #user{
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1><em>hell</em>o world</h1>
    <h2 class="h2">I want to go hoem </h2>
    <h3>위험 하다 생각하면 <em>당근</em>을 흔드세요</h3>
    <p>잘 보고 갑니다</p>

    <div id="user"></div>

    
    <script>

const targetElement = document.querySelector("h3");
const em = document.querySelector("em");
  const text = targetElement.textContent;
  targetElement.textContent = ""; // 원래 텍스트를 비운다.

  function typeWriter(index) {
    if (index < text.length) {
      targetElement.textContent += text.charAt(index);
      
      index++;
      setTimeout(function () {
        typeWriter(index);
      }, 300);
    } else {
      setTimeout(function () {
        targetElement.textContent = "";
        typeWriter(0);
      }, 2000);
    }
  }

  typeWriter(0);


    let names = [
  "Steven Paul Jobs",
  "Bill Gates",
  "Mark Elliot Zuckerberg",
  "Elon Musk",
  "Jeff Bezos",
  "Warren Edward Buffett",
  "Larry Page",
  "Larry Ellison",
  "Tim Cook",
  "Lloyd Blankfein",
  ];

  let nameUpper = names.map((item)=>item.toUpperCase());
  console.log(nameUpper);

  let firstName = names.map((item)=>item.split(' ')[0]);
  console.log(firstName);

  let includeA = names.filter((item) => item.includes('a'));
  console.log(includeA);

  let names20 = names.some((item)=> item.length>20);
  console.log(names20);

  if(names20){
    console.log("20자 넘는 이름이 있어요")
  }else{
    console.log("읍서요")
  }


  let everyName = names.every((item)=>item.length>=20);
  console.log(everyName);

  let findName = names.find((item)=>item.length>20);
  console.log(findName);

  

    </script>
</body>
</html>
