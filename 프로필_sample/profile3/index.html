<!DOCTYPE html>
<html lang="ko">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">	
	<title>제목</title>
	
	<link rel="stylesheet" href="./css/jquery.multiscroll.css" >		
	<link rel="stylesheet" href="examples.css" >		
	<style>
		.ms-section{
			text-align: center;
		}

		#menu li {
			display:inline-block;
			margin: 10px;
			color: #000;
			background:#fff;
			background: rgba(255,255,255, 0.3);
			-webkit-border-radius: 10px; 
		            border-radius: 10px; 
		}
		#menu li.active{
			background:#666;
			background: rgba(255,255,255, 1);
			color: #000;
		}
		#menu li a{
			text-decoration:none;
			color: #000;
		}
		#menu li.active a:hover{
			color: #000;
		}
		#menu li:hover{
			background: rgba(255,255,255, 0.8);
		}
		#menu li a,
		#menu li.active a{
			padding: 9px 18px;
			display:block;
		}
		#menu li.active a{
			color: #000;
		}
		#menu{
			position:fixed;
			top:0;
			left:0;
			height: 40px;
			z-index: 70;
			width: 100%;
			padding: 0;
			margin:0;
		}
	</style>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>


<ul id="menu">
	<li data-menuanchor="first"><a href="#first">First section</a></li>
	<li data-menuanchor="second"><a href="#second">Second section</a></li>
	<li data-menuanchor="third"><a href="#third">Third section</a></li>
</ul>

<div id="myContainer">

	<div class="ms-left">
		<div class="ms-section" id="left1">
			<h1>Left 1</h1>
		</div>

		<div class="ms-section" id="left2">
			<h1>Left 2 </h1>
		</div>

		<div class="ms-section" id="left3">
			<h1>Left 3</h1>
		</div>
	</div>
	
	<div class="ms-right">
		<div class="ms-section" id="right1">
			<h1>Right 1</h1>
		</div>

		<div class="ms-section" id="right2">
			<h1>Right 2</h1>
		</div>

		<div class="ms-section" id="right3">
			<h1>Right 3</h1>
		</div>
	</div>	
</div>

<script
src="https://code.jquery.com/jquery-3.6.0.min.js"
integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
crossorigin="anonymous"></script>
<script src="./js/jquery.multiscroll.js"></script>

<script>
 $(document).ready(function() {
		$('#myContainer').multiscroll({
			sectionsColor: ['#8FB98B', '#DE564B', '#EAE1C0'],
			anchors: ['first', 'second', 'third'],
			menu: '#menu',
			css3: true,
			navigation:true,
			
			//equivalent to jQuery `easeOutBack` extracted from http://matthewlein.com/ceaser/
			easingcss3: 'cubic-bezier(0.175, 0.885, 0.320, 1.275)'
		});
	});
</script>



</body>
</html>
